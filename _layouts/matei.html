<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | default: site.title | escape }}">
    <title>{{ site.title }}</title>
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/matei.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="identity">
          <div class="identity-copy">
            <h1>{{ site.author.name }}</h1>
            <p class="affiliation">Graduate Student<br>Southeast University</p>
            <p class="profile-links">
              <a href="mailto:{{ site.author.email }}">Email</a>
              <a href="{{ site.author.googlescholar }}">Google Scholar</a>
              <a href="https://github.com/{{ site.author.github }}">GitHub</a>
              <a href="{{ site.author.linkedin }}">LinkedIn</a>
            </p>
          </div>
          <img class="portrait" src="{{ '/images/Fanhang.jpg' | relative_url }}" alt="Portrait of {{ site.author.name }}">
        </div>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="#about">Home</a>
          <a href="#research">Research</a>
          <a href="#publications">Publications</a>
          <a href="#education">Education</a>
          <a href="#experience">Experience</a>
          <a href="#awards">Awards</a>
        </nav>
      </header>
      <main>{{ content }}</main>
      <footer>
        <span>&copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}</span>
        <span>Last updated October 2026</span>
      </footer>
    </div>
  </body>
</html>
