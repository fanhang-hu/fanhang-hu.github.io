<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Fanhang Hu — graduate student researching real-time systems and system security.">
    <meta name="theme-color" content="#f6f4ef">
    <title>{{ site.title }} · Academic Homepage</title>
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/matei.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header" id="home">
        <div class="identity">
          <div class="identity-copy">
            <p class="eyebrow">Academic homepage</p>
            <h1>{{ site.author.name }}</h1>
            <p class="affiliation">Graduate Student · Southeast University</p>
            <p class="profile-links">
              <a href="mailto:{{ site.author.email }}">Email <span aria-hidden="true">↗</span></a>
              <a href="{{ site.author.googlescholar }}">Scholar <span aria-hidden="true">↗</span></a>
              <a href="https://github.com/{{ site.author.github }}">GitHub <span aria-hidden="true">↗</span></a>
              <a href="{{ site.author.linkedin }}">LinkedIn <span aria-hidden="true">↗</span></a>
            </p>
          </div>
          <img class="portrait" src="{{ '/images/Fanhang.jpg' | relative_url }}" alt="Portrait of {{ site.author.name }}">
        </div>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="#about">About</a>
          <a href="#research">Research</a>
          <a href="#publications">Publications</a>
          <a href="#education">Education</a>
          <a href="#experience">Experience</a>
          <a href="#awards">Awards</a>
        </nav>
      </header>
      <main>{{ content }}</main>
      <footer>
        <span>&copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}</span>
        <a href="#home">Back to top ↑</a>
      </footer>
    </div>
  </body>
</html>
