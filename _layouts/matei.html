<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ site.description | default: site.title | escape }}">
    <title>{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/matei.css' | relative_url }}">
  </head>
  <body>
    <div id="wrap">
      <header class="header-section">
        <div class="profile-info">
          <h1>{{ site.author.name }}</h1>
          <div class="title">Graduate Student, Southeast University</div>
          <div class="contact-links">
            <a href="mailto:{{ site.author.email }}">Email</a>
            <a href="{{ site.author.googlescholar }}">Google Scholar</a>
            <a href="https://github.com/{{ site.author.github }}">GitHub</a>
            <a href="{{ site.author.linkedin }}">LinkedIn</a>
          </div>
        </div>
        <div class="profile-photo-container">
          <img class="profile-photo" src="{{ '/images/Fanhang.jpg' | relative_url }}" alt="{{ site.author.name }}">
        </div>
      </header>

      <aside id="sidebar">
        <nav class="nav-menu" aria-label="Primary navigation">
          <a href="#about" class="home-link">Home</a>
          <a href="#research">Research</a>
          <a href="#publications">Publications</a>
          <a href="#education">Education</a>
          <a href="#experience">Experience</a>
          <a href="#awards">Awards</a>
        </nav>
      </aside>

      <main id="content">{{ content }}</main>
    </div>

    <footer class="credits">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}.</p>
    </footer>
  </body>
</html>
